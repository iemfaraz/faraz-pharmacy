# Render Blueprint for the Invoice AI bill-reading API.
# New > Blueprint > pick this repo > set "Blueprint path" to invoice-ai/render.yaml
services:
  - type: web
    name: faraz-pharmacy-invoice-ai
    runtime: docker
    dockerfilePath: ./invoice-ai/Dockerfile.api
    dockerContext: ./invoice-ai
    plan: standard            # PaddleOCR needs ~1-2 GB RAM; free/starter (512 MB) will run out of memory
    healthCheckPath: /health
    envVars:
      - key: PHARMACY_API_URL
        value: https://faraz-pharmacy-orders.faraznawaz2014.chatgpt.site
      - key: ALLOWED_ORIGINS
        value: https://iemfaraz.github.io,https://farazpharmacy.com,https://www.farazpharmacy.com
